[workspace]
resolver = "2"
members = ["crates/ac-core", "crates/cm-app"]

[workspace.package]
version = "4.0.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8.23"
tempfile = "3"
dirs = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }
sevenz-rust2 = { version = "0.25", default-features = false, features = ["bzip2", "deflate", "ppmd"] }
unrar = "0.5.8"
gpui = "0.2.2"
unicode-segmentation = "1"

[profile.release]
lto = "thin"
