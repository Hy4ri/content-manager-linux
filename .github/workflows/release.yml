name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 3.0.1 or v3.0.1)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Bump Version and Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      tag: ${{ steps.vars.outputs.tag }}
      prerelease: ${{ steps.vars.outputs.prerelease }}
      commit_sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine release version and tag
        id: vars
        run: |
          RAW_INPUT="${{ inputs.version }}"
          VERSION="${RAW_INPUT#v}"
          TAG="v${VERSION}"

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid semver version: '$RAW_INPUT'"
            exit 1
          fi

          if echo "$VERSION" | grep -q '-'; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Release target: version=${VERSION}, tag=${TAG}, prerelease=${PRERELEASE}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Bump version numbers across workspace
        run: |
          python3 scripts/bump-version.py "${{ steps.vars.outputs.version }}"

      - name: Commit and push version bump and tag
        id: commit
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Cargo.toml Cargo.lock flake.nix crates/

          if ! git diff --cached --quiet; then
            git commit -m "chore(release): ${TAG}"
            git push origin "HEAD:${{ github.ref_name }}"
          else
            echo "Working tree clean; no version diff to commit."
          fi

          git tag -fa "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}" --force
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-tarball:
    name: Build Linux Tarball (Nix)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Set up Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Build cm-rs with Nix
        run: |
          nix build .#cm-rs-src --print-build-logs

      - name: Package release tarball
        run: |
          scripts/package-release.sh "${{ needs.prepare.outputs.tag }}" dist

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-tarball
          path: dist/*.tar.gz
          retention-days: 7

  build-appimage:
    name: Build Linux AppImage (Ubuntu 22.04)
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CEF_ARCHIVE_NAME: cef_binary_151.3.16+gbe1e15d+chromium-151.0.7922.109_linux64_minimal.tar.bz2
      CEF_ARCHIVE_URL: https://cef-builds.spotifycdn.com/cef_binary_151.3.16%2Bgbe1e15d%2Bchromium-151.0.7922.109_linux64_minimal.tar.bz2
      CEF_ARCHIVE_SHA1: 13042a73aeaf0e853a719d3ddad0751514665bb9

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake ninja-build patchelf \
            libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libfontconfig-dev libfreetype-dev libvulkan-dev \
            libssl-dev libzstd-dev curl bzip2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cache CEF minimal runtime
        id: cef-cache
        uses: actions/cache@v4
        with:
          path: .cef-cache
          key: cef-151.3.16-linux64-minimal

      - name: Download and prepare CEF runtime
        run: |
          if [ ! -f ".cef-cache/${CEF_ARCHIVE_NAME}" ]; then
            mkdir -p .cef-cache
            curl -fL --retry 3 -o ".cef-cache/${CEF_ARCHIVE_NAME}" "${CEF_ARCHIVE_URL}"
          fi
          echo "${CEF_ARCHIVE_SHA1}  .cef-cache/${CEF_ARCHIVE_NAME}" | sha1sum -c -

          rm -rf cef-raw cef-runtime
          mkdir -p cef-raw cef-runtime
          tar -xjf ".cef-cache/${CEF_ARCHIVE_NAME}" --strip-components=1 -C cef-raw

          for entry in cef-raw/*; do
            ln -s "$(readlink -f "$entry")" "cef-runtime/$(basename "$entry")"
          done
          for entry in cef-raw/Release/* cef-raw/Resources/*; do
            base="$(basename "$entry")"
            if [ "$base" != "libvulkan.so.1" ]; then
              ln -s "$(readlink -f "$entry")" "cef-runtime/$base"
            fi
          done
          printf '{"name":"%s","sha1":"%s","type":"minimal"}' \
            "${CEF_ARCHIVE_NAME}" "${CEF_ARCHIVE_SHA1}" > cef-runtime/archive.json

      - name: Build cm-rs release binary
        run: |
          CEF_PATH="$PWD/cef-runtime" cargo build --release --locked -p cm-app

      - name: Download appimagetool
        run: |
          curl -fL --retry 3 -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool

      - name: Package AppImage
        run: |
          APPIMAGETOOL=/tmp/appimagetool \
            scripts/package-appimage.sh \
            "${{ needs.prepare.outputs.tag }}" \
            target/release/cm-rs \
            "$PWD/cef-runtime" \
            dist

      - name: Smoke-test AppImage
        run: |
          APPIMAGE="dist/cm-rs-${{ needs.prepare.outputs.tag }}-x86_64.AppImage"
          APPIMAGE_EXTRACT_AND_RUN=1 "./${APPIMAGE}" --help

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-appimage
          path: dist/*.AppImage
          retention-days: 7

  build-arch:
    name: Build Arch Linux Package
    needs: [prepare, build-appimage]
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    timeout-minutes: 20

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - name: Download AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: release-appimage
          path: dist

      - name: Build and verify Arch package
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          TAG="${{ needs.prepare.outputs.tag }}"
          APPIMAGE="dist/cm-rs-${TAG}-x86_64.AppImage"

          pacman -Syu --noconfirm python

          APPIMAGE_SHA256="$(sha256sum "$APPIMAGE" | awk '{print $1}')"
          LICENSE_SHA256="$(sha256sum LICENSE | awk '{print $1}')"
          python3 scripts/update-pkgbuild.py "$VERSION" "$APPIMAGE_SHA256" "$LICENSE_SHA256"

          useradd -m builder
          mkdir -p /tmp/arch-build
          cp packaging/arch/PKGBUILD /tmp/arch-build/PKGBUILD
          cp "$APPIMAGE" "/tmp/arch-build/cm-rs-${TAG}-x86_64.AppImage"
          cp LICENSE "/tmp/arch-build/cm-rs-${TAG}-LICENSE"
          chown -R builder:builder /tmp/arch-build

          su -s /bin/bash builder -c "cd /tmp/arch-build && makepkg --nodeps --noconfirm && makepkg --printsrcinfo > .SRCINFO"

          mkdir -p dist-arch
          cp /tmp/arch-build/cm-rs-bin-*.pkg.tar.zst dist-arch/
          cp /tmp/arch-build/.SRCINFO dist-arch/SRCINFO

          # Smoke-test install, shared library resolution, and CLI entry point on real Arch.
          pacman -U --noconfirm dist-arch/cm-rs-bin-*.pkg.tar.zst
          ! ldd /opt/cm-rs/cm-rs /opt/cm-rs/libcef.so | grep -q 'not found'
          cm-rs --help

      - name: Upload Arch package artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-arch
          path: dist-arch/*.pkg.tar.zst
          retention-days: 7

      - name: Upload Arch .SRCINFO artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-arch-srcinfo
          path: dist-arch/SRCINFO
          retention-days: 7

  publish:
    name: Publish GitHub Release and Pin Packaging
    needs: [prepare, build-tarball, build-appimage, build-arch]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Stage .SRCINFO and keep release dist clean
        run: |
          if [ -f dist/SRCINFO ]; then
            mv dist/SRCINFO packaging/arch/.SRCINFO
          fi

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.AppImage *.pkg.tar.zst > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload combined release artifact
        uses: actions/upload-artifact@v4
        with:
          name: cm-rs-${{ needs.prepare.outputs.tag }}-linux-x86_64
          path: dist/*
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/*

      - name: Pin flake and Arch PKGBUILD to the published release
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          TAG="${{ needs.prepare.outputs.tag }}"
          TARBALL="dist/cm-rs-${TAG}-linux-x86_64.tar.gz"
          APPIMAGE="dist/cm-rs-${TAG}-x86_64.AppImage"
          HASH="$(python3 -c 'import hashlib, base64, sys; print("sha256-" + base64.b64encode(hashlib.sha256(open(sys.argv[1], "rb").read()).digest()).decode())' "$TARBALL")"
          printf '{\n  "version": "%s",\n  "hash": "%s"\n}\n' "$VERSION" "$HASH" > packaging/release.json

          APPIMAGE_SHA256="$(sha256sum "$APPIMAGE" | awk '{print $1}')"
          LICENSE_SHA256="$(sha256sum LICENSE | awk '{print $1}')"
          python3 scripts/update-pkgbuild.py "$VERSION" "$APPIMAGE_SHA256" "$LICENSE_SHA256"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packaging/release.json packaging/arch/PKGBUILD packaging/arch/.SRCINFO
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): pin flake and Arch PKGBUILD to ${TAG}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
