[package]
name = "ac-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Assetto Corsa content, data.acd, race.ini and launch support"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tempfile.workspace = true
dirs.workspace = true
zip.workspace = true
sevenz-rust2.workspace = true
unrar.workspace = true
# Lobby and server HTTP (all plain HTTP, so no TLS). Already in the lock through download-cef.
ureq = { version = "3.4", default-features = false, features = ["gzip"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
